title: Engineering Notes
description: Learnings in System Design, DSA, AI, and Projects
url: "https://sreeramkarumury.github.io"
baseurl: "/engineering"

remote_theme: just-the-docs/just-the-docs@v0.10.1

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

permalink: pretty
search_enabled: true
heading_anchors: true
color_scheme: light


nav_sort: case_insensitive

# Draft notes: set `published: false` in front matter to keep them off the site
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
